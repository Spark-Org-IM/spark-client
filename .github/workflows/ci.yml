name: build

on:
  push:
    branches:
      - main
      - 'dev-*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev dpkg-dev patchelf

      - name: Cache FTXUI source (fallback build)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ftxui-${{ runner.os }}-${{ matrix.arch }}-v6.1.9

      - name: Configure
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          project="${version%-*}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${project}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${project}" >&2
            exit 1
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb and Linux executable
        run: |
          cd build
          cpack -G DEB
          project_version=$(grep '^SPARK_TUI_PROJECT_VERSION:STRING=' CMakeCache.txt | cut -d= -f2)
          name="spark-tui-${project_version}-linux-${{ matrix.arch }}"
          mkdir -p "../$name"
          cp spark-tui spark-client "../$name/"
          cp -a libsparkapp-core.so* "../$name/"
          # Build-tree rpaths point at the CI workspace; the tarball must resolve
          # libsparkapp-core.so next to the binaries instead.
          patchelf --set-rpath '$ORIGIN' "../$name/spark-tui" "../$name/spark-client"
          cp ../README.md ../LICENSE ../docs/config.example.toml "../$name/"
          tar -C .. -czf "spark-tui_${project_version}_linux-${{ matrix.arch }}.tar.gz" "$name"
          sha256sum ./*.deb ./*.tar.gz > "SHA256SUMS-${{ matrix.arch }}"

      - name: Verify Linux tarball
        if: matrix.arch == 'amd64'
        run: |
          cd build
          project_version=$(grep '^SPARK_TUI_PROJECT_VERSION:STRING=' CMakeCache.txt | cut -d= -f2)
          rm -rf /tmp/tarcheck
          mkdir -p /tmp/tarcheck
          tar -xzf "spark-tui_${project_version}_linux-amd64.tar.gz" -C /tmp/tarcheck
          cd /tmp
          env -u LD_LIBRARY_PATH "/tmp/tarcheck/spark-tui-${project_version}-linux-amd64/spark-tui" --version
          env -u LD_LIBRARY_PATH "/tmp/tarcheck/spark-tui-${project_version}-linux-amd64/spark-client" --version
          if readelf -d "/tmp/tarcheck/spark-tui-${project_version}-linux-amd64/spark-tui" | grep -v '\$ORIGIN' | grep -q 'RPATH\|RUNPATH'; then
            echo "tarball binary still contains a non-\$ORIGIN rpath" >&2
            exit 1
          fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: spark-tui-linux-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.tar.gz
            build/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: amd64
            generator_arch: x64
            triplet: x64-windows-static
          - runner: windows-11-arm
            arch: arm64
            generator_arch: arm64
            triplet: arm64-windows-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Cache FTXUI source (fallback build)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ftxui-${{ runner.os }}-${{ matrix.arch }}-v6.1.9

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          if (-not (Test-Path "$vcpkg/scripts/buildsystems/vcpkg.cmake")) {
            throw "vcpkg toolchain not found under $vcpkg"
          }
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          $project = $version.Split('-')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$project") {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION v$project"
          }
          $args = @(
            '-S', '.', '-B', 'build',
            '-A', '${{ matrix.generator_arch }}',
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            '-DCMAKE_BUILD_TYPE=Release'
          )
          cmake @args

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path build/CMakeCache.txt -Pattern '^SPARK_TUI_PROJECT_VERSION:STRING=(.+)$').Matches.Groups[1].Value
          $name = "spark-tui-$version-windows-${{ matrix.arch }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/spark-tui.exe $stage
          Copy-Item -Path README.md,LICENSE -Destination $stage
          Copy-Item docs/config.example.toml $stage
          $zip = "build/spark-tui_${version}_windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "build/SHA256SUMS-windows-${{ matrix.arch }}"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: spark-tui-windows-${{ matrix.arch }}
          path: |
            build/*.zip
            build/SHA256SUMS-windows-${{ matrix.arch }}
          if-no-files-found: error

  gtk:
    name: gtk-framework
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Configure GTK frontend
        run: |
          cmake -S . -B build-gtk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPARK_TUI_BUILD_GTK=ON

      - name: Build GTK frontend
        run: cmake --build build-gtk --target spark-gui --parallel 4

  source:
    name: debian-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install source packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Build Debian source package
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          project="${version%-*}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${project}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${project}" >&2
            exit 1
          fi
          packaging/sync-version.sh --check
          packaging/build-source.sh "${version}"

      - name: Checksums
        run: |
          cd build/source
          sha256sum ./*.dsc ./*.orig.tar.* ./*.debian.tar.* ./*.changes ./*.buildinfo > SHA256SUMS-source

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: spark-tui-source
          path: build/source/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
      - source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: spark-tui-*
          merge-multiple: true
          path: dist

      - name: Create release bundle
        run: |
          set -eu
          cd dist
          rm -f SHA256SUMS* spark-tui_*_all.tar.gz
          version="${GITHUB_REF_NAME#v}"
          folder="spark-tui-${version}"
          rm -rf "../bundle"
          mkdir -p "../bundle/${folder}"
          cp ./*.deb ./*.zip ./*.dsc ./*.orig.tar.* ./*.debian.tar.* \
             ./*.changes ./*.buildinfo ./*_linux-*.tar.gz \
             "../bundle/${folder}/"
          (
            cd "../bundle/${folder}"
            find . -maxdepth 1 -type f -printf '%f\n' | sort \
              | xargs -r sha256sum > /tmp/spark-tui-bundle-SHA256SUMS
            mv /tmp/spark-tui-bundle-SHA256SUMS SHA256SUMS
          )
          tar -C ../bundle -czf "spark-tui_${version}_all.tar.gz" "${folder}"

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS*
          find . -maxdepth 1 -type f -printf '%f\n' | sort \
            | xargs -r sha256sum > /tmp/spark-tui-SHA256SUMS
          mv /tmp/spark-tui-SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
