name: build

on:
  push:
    branches:
      - main
      - 'dev-*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev dpkg-dev

      - name: Cache FTXUI source (fallback build)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ftxui-${{ runner.os }}-v6.1.9

      - name: Configure
        run: |
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            raw="${GITHUB_REF_NAME#v}"
            version="${raw%%-*}"
            package="${version}"
            if [ "${raw}" != "${version}" ]; then
              package="${version}~${raw#*-}"
            fi
            args+=(
              "-DSPARK_TUI_PROJECT_VERSION=${version}"
              "-DSPARK_TUI_PACKAGE_VERSION=${package}"
            )
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          sha256sum ./*.deb > SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: spark-tui-deb
          path: |
            build/*.deb
            build/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: spark-tui-deb
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
