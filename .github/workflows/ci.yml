name: build

on:
  push:
    branches:
      - main
      - 'dev-*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main is release-only. Merging a pull request into it is refused here; the
  # check is meant to be required by branch protection.
  no-merge-to-main:
    name: no-merge-to-main
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Reject changes to main
        run: |
          echo "::error::main is release-only; keep changes on dev branches."
          exit 1

  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev dpkg-dev patchelf file

      - name: Install GTK packaging dependencies
        if: github.ref_type == 'tag'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Cache FTXUI source (fallback build)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ftxui-${{ runner.os }}-${{ matrix.arch }}-v6.1.9

      - name: Configure
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi
          # Only tag builds package sparkapp-gui, so the GUI is compiled
          # into this build tree exclusively for releases.
          gtk=OFF
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then gtk=ON; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSPARK_TUI_BUILD_GTK=$gtk

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Plugins are never built here. This only proves that the installed
      # plugin SDK is self-contained and usable by an out-of-tree project.
      - name: Plugin SDK smoke test
        run: |
          cat > /tmp/spark_sdk_smoke.cpp <<'EOF'
          #include <string>

          #include "plugin/sdk.h"

          class SmokePlugin : public spark::plugin::Plugin {
           public:
            explicit SmokePlugin(const spark_host_api* host)
                : spark::plugin::Plugin(host) {}
            std::string Id() const override { return "sdk-smoke"; }
            std::string ActionsJson() const override { return "[]"; }
            std::string RunJson(const std::string&,
                                const std::string&) override {
              return "{\"ok\":true}";
            }
          };

          SPARK_PLUGIN_EXPORT(SmokePlugin)
          EOF
          g++ -std=c++20 -shared -fPIC -Wall -Wextra -Wpedantic \
            -I src /tmp/spark_sdk_smoke.cpp -o /tmp/spark_sdk_smoke.so

      # Pushing a branch only compiles and tests. Release artifacts are
      # produced exclusively for v* tags so a merge request can be checked
      # quickly without paying for .deb / tar packaging.
      - name: Package .deb and Linux executable
        if: github.ref_type == 'tag'
        run: |
          cd build
          cpack -G DEB
          project_version=$(grep '^SPARK_TUI_PROJECT_VERSION:STRING=' CMakeCache.txt | cut -d= -f2)
          name="spark-client-${project_version}-linux-${{ matrix.arch }}"
          mkdir -p "../$name"
          cp spark-tui spark-client "../$name/"
          cp -a libsparkapp-core.so* "../$name/"
          # Build-tree rpaths point at the CI workspace; the tarball must resolve
          # libsparkapp-core.so next to the binaries instead.
          patchelf --set-rpath '$ORIGIN' "../$name/spark-tui" "../$name/spark-client"
          cp ../README.md ../LICENSE ../docs/config.example.toml "../$name/"
          tar -C .. -czf "spark-client_${project_version}_linux-${{ matrix.arch }}.tar.gz" "$name"
          sha256sum ./*.deb ./*.tar.gz > "SHA256SUMS-${{ matrix.arch }}"

      - name: Verify Linux tarball
        if: matrix.arch == 'amd64' && github.ref_type == 'tag'
        run: |
          cd build
          project_version=$(grep '^SPARK_TUI_PROJECT_VERSION:STRING=' CMakeCache.txt | cut -d= -f2)
          rm -rf /tmp/tarcheck
          mkdir -p /tmp/tarcheck
          tar -xzf "spark-client_${project_version}_linux-amd64.tar.gz" -C /tmp/tarcheck
          cd /tmp
          env -u LD_LIBRARY_PATH "/tmp/tarcheck/spark-client-${project_version}-linux-amd64/spark-tui" --version
          env -u LD_LIBRARY_PATH "/tmp/tarcheck/spark-client-${project_version}-linux-amd64/spark-client" --version
          if readelf -d "/tmp/tarcheck/spark-client-${project_version}-linux-amd64/spark-tui" | grep -v '\$ORIGIN' | grep -q 'RPATH\|RUNPATH'; then
            echo "tarball binary still contains a non-\$ORIGIN rpath" >&2
            exit 1
          fi

      - name: Upload Linux packages
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: spark-client-linux-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.tar.gz
            build/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: amd64
            generator_arch: x64
            triplet: x64-windows-static
          - runner: windows-11-arm
            arch: arm64
            generator_arch: arm64
            triplet: arm64-windows-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Cache FTXUI source (fallback build)
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ftxui-${{ runner.os }}-${{ matrix.arch }}-v6.1.9

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          if (-not (Test-Path "$vcpkg/scripts/buildsystems/vcpkg.cmake")) {
            throw "vcpkg toolchain not found under $vcpkg"
          }
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION v$version"
          }
          $args = @(
            '-S', '.', '-B', 'build',
            '-A', '${{ matrix.generator_arch }}',
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            '-DCMAKE_BUILD_TYPE=Release'
          )
          cmake @args

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows executable
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path build/CMakeCache.txt -Pattern '^SPARK_TUI_PROJECT_VERSION:STRING=(.+)$').Matches.Groups[1].Value
          $name = "spark-client-$version-windows-${{ matrix.arch }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/spark-tui.exe $stage
          Copy-Item -Path README.md,LICENSE -Destination $stage
          Copy-Item docs/config.example.toml $stage
          $zip = "build/spark-client_${version}_windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "build/SHA256SUMS-windows-${{ matrix.arch }}"

      - name: Upload Windows package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: spark-client-windows-${{ matrix.arch }}
          path: |
            build/*.zip
            build/SHA256SUMS-windows-${{ matrix.arch }}
          if-no-files-found: error

  gtk:
    name: gtk-framework
    # Tag builds compile the GUI inside the linux packaging jobs; this job is
    # the quick, separate syntax check for branch and pull-request pushes.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Detect GTK frontend
        id: detect
        run: |
          if [ -f src/gtk/main.cpp ] && [ -f src/gtk/application.cpp ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No GTK frontend sources found, skipping the GUI build."
          fi

      - name: Install GTK build dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Configure GTK frontend
        if: steps.detect.outputs.present == 'true'
        run: |
          cmake -S . -B build-gtk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPARK_TUI_BUILD_GTK=ON

      - name: Build GTK frontend
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build-gtk --target spark-gui --parallel 4

  source:
    name: debian-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install source packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Check version sync
        run: packaging/sync-version.sh --check

      - name: Build Debian source package
        if: github.ref_type == 'tag'
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi
          packaging/build-source.sh "${version}"

      - name: Checksums
        if: github.ref_type == 'tag'
        run: |
          cd build/source
          sha256sum ./*.dsc ./*.tar.xz ./*.changes ./*.buildinfo > SHA256SUMS-source

      - name: Upload source package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: spark-client-source
          path: build/source/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
      - source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: spark-client-*
          merge-multiple: true
          path: dist

      # Debian artifacts (binary .deb + source package) are folded into one
      # tar for importing into an apt repository. Everything else stays a
      # separate release asset.
      - name: Bundle Debian packages
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          folder="spark-client-${version}-deb"
          mkdir -p "deb/${folder}/amd64" "deb/${folder}/arm64" \
                   "deb/${folder}/source"
          for file in dist/*.deb; do
            case "$file" in
              *_amd64.deb) cp "$file" "deb/${folder}/amd64/" ;;
              *_arm64.deb) cp "$file" "deb/${folder}/arm64/" ;;
              *)
                echo "unexpected .deb name: $file" >&2
                exit 1
                ;;
            esac
          done
          cp dist/*.dsc dist/*.tar.xz dist/*.changes dist/*.buildinfo \
             "deb/${folder}/source/"
          if [ -f dist/SHA256SUMS-source ]; then
            mv dist/SHA256SUMS-source "deb/${folder}/source/"
          fi
          (
            cd "deb/${folder}"
            find . -type f ! -name SHA256SUMS -printf '%P\n' | sort \
              | xargs -r sha256sum > SHA256SUMS
          )
          tar -C deb -czf "dist/spark-client_${version}_deb.tar.gz" \
            "${folder}"
          rm -f dist/*.deb dist/*.dsc dist/*.tar.xz dist/*.changes \
                dist/*.buildinfo
          ls -l dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "$tag" --generate-notes
          fi
