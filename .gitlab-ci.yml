stages:
  - build

default:
  image: debian:trixie
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      build-essential cmake ninja-build libssl-dev libftxui-dev dpkg-dev

build:
  stage: build
  script:
    - |
      set -eu
      args="-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPARK_TUI_USE_SYSTEM_FTXUI=ON"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        raw="${CI_COMMIT_TAG#v}"
        version="${raw%%-*}"
        package="${version}"
        if [ "${raw}" != "${version}" ]; then
          package="${version}~${raw#*-}"
        fi
        args="$args -DSPARK_TUI_PROJECT_VERSION=${version} -DSPARK_TUI_PACKAGE_VERSION=${package}"
      fi
      cmake $args
    - cmake --build build --parallel "$(nproc)"
    - ctest --test-dir build --output-on-failure
    - cd build
    - cpack -G DEB
    - sha256sum ./*.deb > SHA256SUMS
  artifacts:
    when: always
    paths:
      - build/*.deb
      - build/SHA256SUMS
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
